name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Se precisa gerar build
      - run: npm run build

      # Rodar migrations
      - run: npx prisma migrate deploy

      # Esperar servidor (se ele roda separado)
      - run: |
          npm run start:dev &
          SERVER_PID=$!
          npx wait-on http://localhost:3333
          echo "Server ready"
          npm run test:e2e || EXIT_CODE=$?
          kill $SERVER_PID
          exit ${EXIT_CODE:-0}